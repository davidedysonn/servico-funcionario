# Configuração básica
quarkus.datasource.db-kind=postgresql

# Configuração de conexão do PostgreSQL via variáveis de ambiente
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:funcionario_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:admin}

# Configuração de porta da API via variável de ambiente
quarkus.http.port=${PORT:8080}

# Configuração do Hibernate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.generation=drop-and-create

# Aponta para a chave pública para VERIFICAR a assinatura do token
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:publicKey.pem}

# Informa qual o emissor (issuer) confiável dos tokens. DEVE SER IGUAL ao do usuario-service.
mp.jwt.verify.issuer=${JWT_ISSUER:https://org.usuario.auth}
